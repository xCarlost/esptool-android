name: Build Android APK

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
      - "v*.*.* (*)"

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$apk_path" ]; then
            echo "No release APK was produced. Files in the output directory:"
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          cp "$apk_path" "app/build/outputs/apk/release/FirmwareFlasher-${GITHUB_REF_NAME}.apk"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/FirmwareFlasher-${{ github.ref_name }}.apk
          generate_release_notes: true